[package]
name = "blp"
description = "Blizzard BLP image format reader/writer (Warcraft/World of Warcraft textures)"
authors = ["nazarpunk <nazarpunk@gmail.com>"]
version = "1.0.0"
repository = "https://github.com/WarRaft/blp-rs"
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["blp", "warcraft", "image", "texture"]
categories = ["encoding", "graphics"]
exclude = [
    "preview/*",
    "test-data/*",
    "*.sh",
]

[features]
default = ["encode", "psd", "formats"]
# Writing BLP. JPEG mips are compressed with libjpeg-turbo, a C library
# built from source (needs cmake and a C compiler). Without it, decoding,
# raw mip extraction and PNG/JPEG export still work.
encode = ["dep:turbojpeg"]
# Photoshop documents as input.
psd = ["dep:psd"]
# Every input format the `image` crate reads (AVIF, BMP, DDS, EXR, TGA,
# TIFF, WebP, …), decoded on all cores. Without it: BLP, PNG, JPEG, GIF.
formats = ["image/default-formats", "image/rayon"]

[dependencies]
byteorder = "1.5.0"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
num_enum = "0.7.4"
psd = { version = "0.3.3", optional = true }
turbojpeg = { version = "1.3.3", optional = true }
